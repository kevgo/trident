name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: make setup-ci
      # Windows encounters concurrent file access issues when running
      # `target/debug/trident ci` or `target/release/trident ci`.
      # Some tests try to build that file again,
      # but it cannot be replaced because it is running.
      - run: make lint
      - run: make unit
      - run: make cuke-slow
