name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: make setup-ci
      # running "trident ci" on Windows causes concurrency issues with the Rust toolchain, so we run the tests manually
      - run: make lint
      - run: make unit
      - run: make cuke-slow
